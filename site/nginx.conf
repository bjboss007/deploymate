server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # Static, no cookies, no third parties: the policy can be tight.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;   # the dashboard tour frames our own pages
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-src 'self'; base-uri 'self'; form-action 'self'" always;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml text/plain application/json;

  # expires (not add_header) so the security headers above are still inherited
  location / { try_files $uri $uri/ =404; expires -1; }
  # fonts and the favicon never change under the same name
  location ~* \.(woff2|svg|png)$ { expires 30d; }

  error_page 404 /404.html;
  location = /404.html { internal; }
}
